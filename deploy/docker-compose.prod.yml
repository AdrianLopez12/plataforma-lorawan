version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lorawan-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-lora_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-super_secure_db_pass_123!}
      POSTGRES_DB: ${DB_NAME:-lorawan_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lora_admin} -d ${DB_NAME:-lorawan_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
    driver: local
