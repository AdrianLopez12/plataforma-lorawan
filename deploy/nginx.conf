server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Redirección automática a HTTPS (descomentar una vez instalado Certbot SSL)
    # return 301 https://$host$request_uri;
    
    # Habilitar compresión GZIP para optimizar la velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Servir la interfaz web estática (React)
    location / {
        root /var/www/lorawan-app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para la API del Backend (NestJS)
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Seguridad y paso de IP real del cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para cookies HttpOnly y CORS con credenciales
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=None";
    }

    # Proxy dedicado para el Webhook LoRaWAN (Uplinks)
    location /webhook/ {
        proxy_pass http://localhost:3000/webhook/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cabeceras de endurecimiento de seguridad (Hardening)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
